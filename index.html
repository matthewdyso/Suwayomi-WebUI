<!doctype html>
<html>
    <head>
        <title>Suwayomi</title>
        <meta name="apple-mobile-web-app-title" content="Suwayomi" />
        <meta name="description" content="A manga reader that runs tachiyomi's extensions" />

        <meta charset="utf-8" />

        <meta name="viewport" content="minimum-scale=1, initial-scale=1, viewport-fit=cover, width=device-width" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <!-- the surface colors of the default theme for the first paint; the app updates both to the active theme -->
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FEFBFF" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1B1F" />

        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="./src/index.tsx"></script>
        <script>
            const backgroundColor = (() => {
                let storageValue;
                try {
                    const subpath = (() => {
                        const baseTag = document.querySelector('base');
                        if (!baseTag) {
                            return '';
                        }

                        return baseTag.href.replace(window.location.origin, '').slice(0, -1);
                    })();
                    storageValue = window.localStorage.getItem(`suwayomi_webui_${subpath}_theme_background`);
                } catch (error) {
                    return null;
                }

                try {
                    return JSON.parse(storageValue);
                } catch (e) {
                    return storageValue;
                }
            })();

            if (backgroundColor) {
                document.documentElement.style.backgroundColor = backgroundColor;
                // the browser and pwa ui (e.g. status bar) takes the color of the top app bar
                document.querySelectorAll('meta[name="theme-color"]').forEach((themeColorMeta) => {
                    themeColorMeta.setAttribute('content', backgroundColor);
                });
            }
        </script>
        <!--
  This HTML file is a template.
  If you open it directly in the browser, you will see an empty page.

  You can add webfonts, meta tags, or analytics to this file.
  The build step will place the bundled scripts into the <body> tag.

  To begin the development, run `pnpm start`.
  To create a production bundle, use `pnpm build`.
-->
    </body>
</html>
